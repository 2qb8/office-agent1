name: build-exe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee tests.log

      - name: Show test failures
        if: failure()
        shell: bash
        run: |
          {
            echo "### Test output (tail)"
            echo '```text'
            tail -n 60 tests.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post test failures
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automated test failure report for ${GITHUB_SHA}."
            echo
            echo '```text'
            tail -n 80 tests.log || echo "no tests.log"
            echo '```'
          } > report.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat report.md)" >/dev/null

      - name: Smoke test the desktop window
        continue-on-error: true
        run: python -c "import tkinter, gui; root = tkinter.Tk(); gui.OfficeAgentWindow(root); root.update_idletasks(); root.destroy(); print('window ok')"

      - name: Build executables
        run: python build_exe.py

      - name: Smoke test command line executable
        run: dist\office-agent.exe tools

      - uses: actions/upload-artifact@v4
        with:
          name: office-agent-windows
          path: |
            dist/office-agent.exe
            dist/office-agent-gui.exe
          if-no-files-found: error

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: office-agent-windows
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/office-agent.exe
            dist/office-agent-gui.exe
