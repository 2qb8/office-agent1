name: build-exe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    # The publish step commits the executable to main; skip that bot push so
    # it does not start another build.
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee tests.log

      - name: Show test failures
        if: failure()
        shell: bash
        run: |
          {
            echo "### Test output (tail)"
            echo '```text'
            tail -n 60 tests.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish failure log
        if: failure()
        shell: bash
        run: |
          {
            echo "Test failure report for ${GITHUB_SHA}"
            echo
            grep -E "^(FAIL|ERROR):|^(Ran|FAILED|OK)" tests.log || true
            echo
            echo "--- tail ---"
            tail -n 80 tests.log || echo "no tests.log"
          } > ci-tests.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-report
          git add -f ci-tests.log
          git commit -m "CI test failure report" || true
          git push --force origin ci-report

      - name: Smoke test the desktop window
        continue-on-error: true
        run: python -c "import tkinter, gui; root = tkinter.Tk(); gui.OfficeAgentWindow(root); root.update_idletasks(); root.destroy(); print('window ok')"

      - name: Build executables
        run: python build_exe.py

      - name: Verify both executables exist
        shell: bash
        run: |
          ls -l dist
          test -s dist/office-agent.exe
          test -s dist/office-agent-gui.exe
          cat dist/build-manifest.txt

      - name: Smoke test command line executable
        run: dist\office-agent.exe tools

      - uses: actions/upload-artifact@v4
        with:
          name: office-agent-windows
          path: |
            dist/office-agent.exe
            dist/office-agent-gui.exe
            dist/build-manifest.txt
          if-no-files-found: error

      - name: Publish executable to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/office-agent-gui.exe
          if git diff --cached --quiet; then
            echo "office-agent-gui.exe is unchanged"
            exit 0
          fi
          git commit -m "Publish office-agent-gui.exe from ${GITHUB_SHA:0:7} [skip ci]"
          git push origin HEAD:main

      - name: Publish build manifest
        shell: bash
        run: |
          cp dist/build-manifest.txt build-manifest.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-build
          git add -f build-manifest.txt
          git commit -m "Build manifest for ${GITHUB_SHA}" || true
          git push --force origin ci-build

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: office-agent-windows
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/office-agent.exe
            dist/office-agent-gui.exe
